    <!-- NUEVO: FORMULARIO DE USUARIO -->
    <h2 id="seccion-usuario">Registrar Usuario</h2>
    <div class="contenedor-formulario">
      <label for="idUsuario">Usuario</label>
      <input type="text" id="idUsuario" placeholder="Ej: 102030" />

      <label for="nombreUsuario">Nombre:</label>
      <input type="text" id="nombreUsuario" />

      <label for="apellidoUsuario">Apellido:</label>
      <input type="text" id="apellidoUsuario" />

      <label for="emailUsuario">Email:</label>
      <input type="email" id="emailUsuario" placeholder="correo@ejemplo.com" />

      <label for="celularUsuario">Celular:</label>
      <input type="tel" id="celularUsuario" />

      <label for="contrasenaUsuario">Contraseña:</label>
      <input type="password" id="contrasenaUsuario" />

      <button id="btnRegistrarUsuario">Registrar Usuario</button>
    </div>

    <script src="registro.js"></script>
  </body>
</html>
