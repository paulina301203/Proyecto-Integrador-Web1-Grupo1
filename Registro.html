<!doctype html>
<html lang="es">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Crear cuenta — GatoGo</title>
    <meta
      name="description"
      content="Crea tu cuenta de demostración en GatoGo."
    />
    <meta property="og:title" content="Crear cuenta — GatoGo" />
    <meta
      property="og:description"
      content="Crea tu cuenta de demostración en GatoGo."
    />
    <meta property="og:type" content="website" />
    <meta name="twitter:card" content="summary_large_image" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link
      href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:wght@600;800&family=Work+Sans:wght@400;500;600&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="css/styles.css" />
  </head>
  <body data-page="registro">
    <main class="center">
      <form id="auth-form" class="form narrow">
        <p class="eyebrow">Nuevo explorador</p>
        <h1>Comienza tu colección.</h1>
        <p class="notice">
          MockAPI es público: utiliza datos ficticios y una contraseña que no
          uses en ningún otro sitio.
        </p>
        <div class="row">
          <label
            ><span>Nombre</span
            ><input
              class="input"
              name="name"
              required
              autocomplete="given-name" /></label
          ><label
            ><span>Apellido</span
            ><input
              class="input"
              name="last_name"
              required
              autocomplete="family-name"
          /></label>
        </div>
        <label
          ><span>Correo</span
          ><input
            class="input"
            name="email"
            type="email"
            required
            autocomplete="email" /></label
        ><label
          ><span>Teléfono (opcional)</span
          ><input class="input" name="cel_phone" type="tel" /></label
        ><label
          ><span>Contraseña</span
          ><input
            class="input"
            name="password"
            type="password"
            required
            minlength="6"
            autocomplete="new-password"
        /></label>
        <p id="status" class="status" role="status" aria-live="polite"></p>
        <button type="submit" class="btn btn-primary w-full">
          Registrarme
        </button>
        <p class="small">
          ¿Ya tienes cuenta? <a href="login.html">Iniciar sesión →</a>
        </p>
      </form>
    </main>
    <script src="js/domain.js"></script>
    <script src="js/app.js"></script>
  </body>
</html>
