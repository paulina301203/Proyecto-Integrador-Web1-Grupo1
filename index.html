<html lang="es">
  <head>

    <link rel="stylesheet" href="style.css" />

  <body>

    <!--FORMULARIO PARA REGISTRAR UN GATO -->
    <nav class="menu">

    <h2>Registrar gato</h2>
    <label>Nombre:</label>
    <input type="text" id="nombreGato" />

    <label>Color:</label>
    <input type="text" id="colorGato" />

    <label>Descripción:</label>
    <input type="text" id="descripcionGato" />

    <button id="btnAgregar">Agregar gato</button>

    <!-- RESULTADOS -->

    <h2>Gatos registrados</h2>
    <div id="resultadoRegistro">Registros</div>

    <!-- BUSCAR GATO -->

    <h2>Buscar gato</h2>
    <input type="text" id="buscarGato" />
    <button id="btnBuscar">Buscar</button>
    <div id="resultadoBusqueda">Resultado de la Busqueda</div>

    <script src="gatogo.js"></script>
