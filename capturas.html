<!doctype html>
<html lang="es">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Capturas — GatoGo</title>
    <meta
      name="description"
      content="Busca gatos y consulta sus avistamientos."
    />
    <meta property="og:title" content="Capturas — GatoGo" />
    <meta
      property="og:description"
      content="Busca gatos y consulta sus avistamientos."
    />
    <meta property="og:type" content="website" />
    <meta name="twitter:card" content="summary_large_image" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link
      href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:wght@600;800&family=Work+Sans:wght@400;500;600&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="css/styles.css" />
  </head>
  <body data-page="capturas">
    <main class="container page">
      <p class="eyebrow">La colección</p>
      <div class="head">
        <div>
          <h1>Capturas</h1>
          <p class="muted" id="count">Consultando registros…</p>
        </div>
        <a href="registrar.html" class="btn btn-primary">＋ Nueva captura</a>
      </div>
      <div class="toolbar">
        <input
          id="q"
          class="input"
          aria-label="Buscar capturas"
          type="search"
          placeholder="Buscar por nombre, color, ciudad, barrio o dirección…"
        /><select id="color" class="input" aria-label="Filtrar por color">
          <option value="">Todos los colores</option>
        </select>
      </div>
      <p id="status" class="status" role="status" aria-live="polite"></p>
      <p id="result-count" class="small status" aria-live="polite"></p>
      <div id="list" class="grid"></div>
    </main>
    <script src="js/domain.js"></script>
    <script src="js/app.js"></script>
  </body>
</html>
