<!doctype html>
<html lang="es">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Registrar gato — GatoGo</title>
    <meta
      name="description"
      content="Registra un gato y su primera ubicación."
    />
    <meta property="og:title" content="Registrar gato — GatoGo" />
    <meta
      property="og:description"
      content="Registra un gato y su primera ubicación."
    />
    <meta property="og:type" content="website" />
    <meta name="twitter:card" content="summary_large_image" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link
      href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:wght@600;800&family=Work+Sans:wght@400;500;600&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="css/styles.css" />
  </head>
  <body data-page="registrar">
    <main class="container page form-page">
      <div id="registration">
        <p class="eyebrow">Nuevo encuentro</p>
        <h1>Nueva captura</h1>
        <p id="status" class="status" role="status" aria-live="polite"></p>
        <button id="retry" class="btn btn-outline hidden" type="button">
          Reintentar
        </button>
        <form id="cat-form" class="form hidden">
          <div class="row">
            <label
              ><span>Nombre</span
              ><input
                class="input"
                name="name"
                required
                maxlength="100"
                placeholder="Ej. Michi" /></label
            ><label
              ><span>Color</span
              ><select class="input" name="color" required>
                <option>Negro</option>
                <option>Blanco</option>
                <option>Naranja</option>
                <option>Gris</option>
                <option>Atigrado</option>
                <option>Calicó</option>
                <option>Siamés</option>
                <option>Bicolor</option>
                <option>Otro</option>
              </select></label
            >
          </div>
          <label
            ><span>Descripción</span
            ><textarea
              name="description"
              class="input"
              rows="4"
              required
              maxlength="1500"
              placeholder="¿Cómo es el gato?"
            ></textarea>
          </label>
          <div id="location-fields"></div>
          <label
            ><span>Fecha del avistamiento</span
            ><input type="date" class="input" name="date" required
          /></label>
          <div>
            <span class="label">Fotos (hasta 4)</span>
            <div id="photos" class="photos"></div>
          </div>
          <button type="submit" class="btn btn-primary">Guardar captura</button>
        </form>
      </div>
    </main>
    <script src="js/config.js"></script>
    <script src="js/domain.js"></script>
    <script src="js/api.js"></script>
    <script src="js/app.js"></script>
  </body>
</html>
